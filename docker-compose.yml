services:
  postgres:
    image: percona/percona-distribution-postgresql:18.6
    container_name: percona-postgres-demo
    environment:
      POSTGRES_PASSWORD: percona_demo
      POSTGRES_DB: kayak_shop
    ports:
      - "5433:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: